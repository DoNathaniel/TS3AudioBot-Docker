services:
  ts3audiobot:
    image: ts3audiobot-docker:develop
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BOT_REF: develop
    restart: unless-stopped
    expose:
      - "58913"
    volumes:
      - ts3audiobot-data:/data
    tmpfs:
      - /tmp:mode=1777,size=64m
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dokploy-network

volumes:
  ts3audiobot-data:

networks:
  dokploy-network:
    external: true
