services:
  ts3audiobot:
    image: ghcr.io/cookiecr2nk/ts3audiobot-docker:master
    restart: unless-stopped
    environment:
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: /data/.net
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "true"
    expose:
      - "58913"
    volumes:
      - ts3audiobot-data:/data
    tmpfs:
      - /tmp:mode=1777,size=64m
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dokploy-network

volumes:
  ts3audiobot-data:

networks:
  dokploy-network:
    external: true
